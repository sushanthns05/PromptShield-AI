services:
  - type: web
    name: promptshield-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PROMPTSHIELD_ALLOWED_ORIGINS
        value: "https://pomptshieldai.web.app,https://pomptshieldai.firebaseapp.com,http://localhost:3000,http://localhost:5173"
      - key: PROMPTSHIELD_DATASET_PATH
        value: "research/datasets/prompts.csv"
